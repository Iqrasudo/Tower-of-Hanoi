name: towerofhanoi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  http: ^0.13.5
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.1.2
  github_sign_in_plus: ^0.0.2

  # Sound effects
  audioplayers: ^6.1.0

  # Certificate generation (PDF), preview/print/share, download to device
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4

  # Date formatting for certificates
  intl: ^0.19.0

  # Persist selected theme across sessions
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/
    # - images/a_dot_ham.jpeg


# ✅ ICON CONFIG MUST BE HERE (OUTSIDE flutter block)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/selected-rod.png"